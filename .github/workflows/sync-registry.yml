name: Sync MCP registry snapshot

on:
  schedule:
    # Every 4h (00/04/08/12/16/20 UTC). The upstream has multi-hour SLOW stretches
    # where a full fetch can't finish; a single daily run that lands in one of those
    # windows fails and the directory goes stale for a day. Sampling 6 windows/day
    # means a good window is caught even when several are bad — fail-fast + retry-often
    # is the reliability lever for a flaky upstream, not one heroic long run. A
    # successful run is a no-op if the snapshot is unchanged ("No registry changes").
    - cron: '0 */4 * * *'
  workflow_dispatch: {}  # allow manual triggers from the Actions UI

concurrency:
  # Never run two syncs at once; if a slow run is still going when the next 4h trigger
  # fires, queue it rather than cancel (cancel-in-progress:false) so a nearly-done fetch
  # isn't thrown away.
  group: sync-registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # FAIL-FAST ceiling (paired with the every-4h schedule above). A good window finishes
    # the ~180-page version=latest fetch in well under 5min; a run still going at 120min is
    # stuck in a bad upstream window, so cut it and let the next 4h run try a fresh window.
    # Per-page patience (60s x6, scripts/sync-registry.mjs) still absorbs a lone transient
    # stall inside an otherwise-good window. The mcpindex-snapshot-freshness probe pages if
    # every window stays bad past ~36h.
    #
    # MEASURED 2026-07-20: good windows took 34s-4m41s (~0.08s/page) for the old unfiltered
    # ~560-page fetch; bad windows sustained 15s/page. Since 2026-07-22 we pass
    # version=latest (API filter) so the page count drops ~3x (~18k latest vs ~56k raw).
    # Deadline is 110min under a 120min job ceiling so a ~30s/page degraded window can
    # still finish ~180 pages (~90min); early-bail after ~15 pages trips only when the
    # projection for ~200 pages exceeds that with 5% slack (roughly 40s+/page sustained).
    # Measured 2026-07-22 afternoon: upstream held ~30s/page and the prior 80/90 ceilings
    # early-bailed a completable window.
    #
    # Bad-window runs log ZERO fetch retries: each page still completes inside its 60s
    # timeout, it is just slow. Do not read "no retries" as "not a slow window".
    # SYNC_DEADLINE_MS self-terminates with a red failure (CI timeout="cancelled"
    # was silent for weeks). This ceiling is the backstop.
    timeout-minutes: 120
    steps:
      # main requires PR reviews (enforce_admins=false), so the default GITHUB_TOKEN
      # (github-actions[bot], not an admin) is REJECTED on `git push` — every synced
      # snapshot committed fine but failed to land ("protected branch hook declined").
      # Push with SYNC_PAT: a fine-grained PAT (Contents: Read+Write on mcpindex-web)
      # owned by an admin, so the push bypasses the PR rule the same way an admin push
      # does — without adding github-actions to the branch-protection bypass list (which
      # would weaken the guard on the adjudication ledger). Falls back to GITHUB_TOKEN if
      # the secret is unset (fetch/commit still run; only the push is gated on the PAT).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT || github.token }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest registry
        run: node scripts/sync-registry.mjs

      - name: Healthcheck — refuse to commit a partial fetch
        run: |
          ENTRIES=$(node -e "console.log(require('./data/snapshot.json').servers.length)")
          echo "Snapshot contains $ENTRIES active servers"
          # Floor set proportional to the known corpus (~17.4k latest servers on
          # 2026-07-18). A partial fetch that still clears the old floor of 1000 was
          # slipping through; this catches a fetch that drops a large chunk of the tail.
          # Raise it as the registry grows.
          if [ "$ENTRIES" -lt 14000 ]; then
            echo "::error::Suspiciously small snapshot ($ENTRIES, expected ~17k). Refusing to commit. Likely a partial fetch or upstream API issue."
            exit 1
          fi
          echo "ENTRIES=$ENTRIES" >> "$GITHUB_ENV"

      - name: Healthcheck — the slug map must bind to the snapshot just written
        run: |
          node -e "
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const m = JSON.parse(fs.readFileSync('data/slugmap.json', 'utf8'));
            const want = createHash('sha256').update(fs.readFileSync('data/snapshot.json')).digest('hex');
            if (m.inputs.snapshot_sha256 !== want) {
              console.error('::error::slugmap.json does not bind to the snapshot beside it. Refusing to commit — the screener would key verdicts against a stale map.');
              process.exit(1);
            }
            const n = Object.keys(m.servers).length;
            if (n !== m.counts.servers) { console.error('::error::slugmap counts disagree with its payload'); process.exit(1); }
            const slugs = new Set(Object.values(m.servers));
            if (slugs.size !== n) { console.error('::error::slugmap is not injective — two names share a slug'); process.exit(1); }
            console.log('slugmap: ' + n + ' servers, bound to snapshot, injective');
          "

      # snapshot.json is the directory corpus; server-removals.json is the SEO 410/308
      # ledger consumed by lib/serverRemovals.ts; slugmap.json is the name -> public slug map
      # mcpindex-trust keys every verdict by. All three are produced by sync-registry.mjs.
      # Staging only the snapshot (pre-2026-07-22) left removals dirty in the working tree;
      # when main moved under a long fetch, `git rebase` refused ("unstaged changes") and
      # the successful fetch never landed (run 29958442988). EVERY file the sync writes must
      # be staged here or that failure repeats — and for slugmap.json it would also strand
      # the screener on a map that no longer binds to the snapshot.
      - name: Stage snapshot + removals + slug map
        run: |
          git add data/snapshot.json data/server-removals.json data/slugmap.json
          git status --short

      - name: Commit and push if changed
        run: |
          if git diff --staged --quiet; then
            echo "No registry changes since last sync. Exiting cleanly."
            exit 0
          fi
          git config user.name "mcpindex-sync-bot"
          git config user.email "3028386+gautamgb@users.noreply.github.com"
          git commit -m "data: refresh registry snapshot (${ENTRIES} servers)

          Auto-generated by .github/workflows/sync-registry.yml on $(date -u +%Y-%m-%dT%H:%M:%SZ).
          Vercel will redeploy on push, propagating the new servers, scores, and changelog."
          # A full version=latest fetch can take 45-70min on a slow window; main moves
          # under us (verdicts sync, product commits). Non-fast-forward push is expected
          # - rebase onto tip and retry rather than failing after a successful fetch.
          # If data/snapshot.json conflicts (another sync or a rare manual edit), keep
          # OURS (= the commit being replayed = this run's fresh fetch). During rebase,
          # --theirs is the commit being applied.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (main moved); rebase onto origin/main (attempt ${attempt}/5)"
            git fetch origin main
            # Belt-and-suspenders: any leftover dirty/untracked file (or future producer
            # writes) blocks rebase the same way server-removals.json did. Stash then
            # rebase — dated archives under data/snapshots/ are gitignored and irrelevant.
            # Runner is ephemeral so the stash need not be dropped after success.
            if [ -n "$(git status --porcelain)" ]; then
              git stash push -u -m "sync-pre-rebase-${attempt}" || {
                echo "::error::git stash failed with dirty working tree; aborting"
                git status --short || true
                exit 1
              }
            fi
            if git rebase origin/main; then
              continue
            fi
            # Rebase started but hit conflicts — resolve snapshot/removals in favor of
            # this run's commit (--theirs during rebase = the commit being applied).
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              if [ -f data/snapshot.json ]; then
                git checkout --theirs -- data/snapshot.json
                git add data/snapshot.json
              fi
              if [ -f data/server-removals.json ]; then
                git checkout --theirs -- data/server-removals.json
                git add data/server-removals.json
              fi
              if ! GIT_EDITOR=true git rebase --continue; then
                echo "::error::rebase --continue failed after resolving snapshot/removals; aborting"
                git rebase --abort || true
                exit 1
              fi
            else
              echo "::error::rebase failed to start (dirty tree or other); aborting"
              exit 1
            fi
          done
          echo "::error::push failed after 5 rebase retries"
          exit 1
