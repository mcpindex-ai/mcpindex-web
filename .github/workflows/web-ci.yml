name: mcpindex-web CI

# Lint + typecheck + unit tests for the web app (repo root). Vercel runs `next build`
# on deploy but never the test suite, so without this a regression in lib/ledger,
# lib/driftStats, lib/driftQuery, lib/badge, etc. would ship unnoticed. ubuntu-only
# (macOS runners bill 10x).

on:
  # DELIBERATELY UNFILTERED. `verify` is the only REQUIRED check on main, and a path filter on
  # a required check does not report "skipped" to branch protection - it reports nothing, so any
  # PR touching only unlisted paths is permanently unmergeable. That was first hit by the
  # source-liveness publisher (PRs touching only data/source-liveness.json were undismissable
  # and the published census silently sat a week stale) and patched by adding 'data/**'. Adding
  # one path per outage is the wrong fix: the same trap was still live for content/** (guides),
  # proxy.ts, next.config.ts, public/**, vercel.json, e2e/** and the lint/postcss/playwright
  # configs, and every new top-level file would re-arm it. An allowlist is incompatible with a
  # required check, so PRs now always run. The cost is a few ubuntu minutes on doc-only PRs,
  # which is cheaper than one unmergeable PR.
  #
  # Bonus: `contrast` runs `npm run build`, which is where check-graduation-honesty and
  # check-diagram-freshness execute. Unfiltered PRs mean a content/ change that trips the
  # honesty guard now fails review instead of failing the Vercel production deploy.
  pull_request:
  # The push filter STAYS, and stays narrow: push is not gated by branch protection, so a skip
  # here is harmless, and 'data/**' is intentionally absent because the 2-hourly Hetzner verdict
  # sync pushes straight to main. Without that omission every sync would trigger a full build
  # plus a Chromium download, 12 times a day, for a machine-generated data refresh.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'test/**'
      - 'components/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
      # These three DERIVED artifacts are runtime-trusted and must be gated, even though
      # 'data/**' as a whole is deliberately excluded above. lib/registry.ts loadServers()
      # PREFERS data/server-index.json over the snapshot, and mcpindex-trust keys every verdict
      # by data/slugmap.json. lib/serverIndexArtifact.test.ts and lib/slugmapArtifact.test.ts
      # are the only things binding either file to the pipeline, and Vercel runs `npm run
      # build`, not the tests — so before this, a commit touching only these files deployed to
      # production having executed ZERO validation of them. Naming them individually rather
      # than widening to 'data/**' keeps the ~12/day verdicts.json syncs from triggering a full
      # build plus a Chromium download, which is why the omission exists in the first place.
      #
      # data/source-liveness.json qualifies on exactly that test and was missed. lib/quality.ts
      # takes `liveness` as a REQUIRED argument and withholds the two repository-derived credits
      # from a flagged listing, so the file moves a RANKING that /leaderboard, /best and
      # rankServers -> /api/v1/preflight all consume. lib/sourceLiveness.test.ts and
      # lib/quality.test.ts bind it, and Vercel runs neither. The gap was not theoretical: #85
      # merged 2026-08-12 on a `verify` computed against a base four commits stale (the ruleset
      # sets strict:false, so GitHub never required an up-to-date branch), and because this file
      # was unlisted here, nothing ran against the merged tree at all. The liveness publisher is
      # human-gated by design, which makes it the one PR class that reliably sits long enough
      # for its base to move. It publishes weekly plus a 48h re-check, so this costs about one
      # run a week, not the ~12/day that keeps 'data/**' excluded.
      - 'data/server-index.json'
      - 'data/slugmap.json'
      - 'data/source-liveness.json'

# Supersede, don't stack. 232 of this workflow's 239 runs 2026-08-01..17 ran to completion
# because nothing ever canceled them, and each run pays for `contrast` (full ~15k-page build
# + Chromium download) - so a burst of pushes to main paid for every intermediate build. The
# org exhausted its 2,000 included Actions minutes mid-cycle in August. Only the newest run
# per branch matters for CI signal: cancel the older one. head_ref first for the same reason
# as mcpindex-trust's ci.yml - it is the bare branch name on pull_request, while ref_name is
# `<n>/merge` there; on push (main only here) ref_name is the branch.
concurrency:
  group: web-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Merge gate for machine-published data. Two VM publishers arm GitHub auto-merge when
      # this job is green; a shell-side path check alone is not enough (token with
      # Contents+PR write can arm any PR). Re-evaluate the full PR file list here so a later
      # push onto either publish branch cannot ride non-allowlisted paths in.
      #
      #   verdict-anchors -> data/verdict-anchors.json + public/anchors/<sha256>.ots
      #   liveness-data   -> data/source-liveness.json
      #
      # Each regex is mirrored in its publisher's ALLOWLIST_RE (mcpindex-trust/scripts/
      # publish_verdict_anchors.sh, publish_source_liveness.sh). Change both together.
      - name: Machine-publish path allowlist
        if: github.event_name == 'pull_request' && (github.head_ref == 'verdict-anchors' || github.head_ref == 'liveness-data')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request

          ALLOW = {
              "verdict-anchors": r"^(data/verdict-anchors\.json|public/anchors/[0-9a-f]{64}\.ots)$",
              "liveness-data": r"^data/source-liveness\.json$",
          }
          head = os.environ["HEAD_REF"]
          # An unknown head branch reaching this step means the `if:` above and this table
          # have drifted apart. Fail rather than fall through to an empty allowlist.
          if head not in ALLOW:
              raise SystemExit(f"allowlist: no rule for head branch {head!r}")
          allow = re.compile(ALLOW[head])
          url = (
              f"https://api.github.com/repos/{os.environ['REPO']}/pulls/"
              f"{os.environ['PR_NUMBER']}/files?per_page=100"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mcpindex-web-ci",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              files = json.load(resp)
          names = [f["filename"] for f in files]
          if not names:
              raise SystemExit(f"allowlist: PR on {head} has no files")
          bad = [n for n in names if not allow.match(n)]
          if bad:
              raise SystemExit(
                  f"allowlist: non-allowlisted path(s) on {head}: " + ", ".join(bad)
              )
          print(f"allowlist ok ({head}):", ", ".join(names))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # Fails the PR that edits code a walkthrough guide documents without re-stamping the
      # guide. mcpindex-docs-freshness was red on 194 of 268 runs because nothing made the
      # two travel together; this is the forcing function that makes that probe a backstop
      # instead of a permanently lit lamp. Reads the PR file list over the API rather than
      # taking fetch-depth: 0 - this repo's history is 1.2GB.
      - name: Guide freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-guide-freshness.mjs

      # Fails the PR that adds or edits a generated per-server connect guide whose SEO metadata
      # never names the server it is about. PR #92 merged five of them and one named its server
      # in none of h1/meta_description/outcome, while its body was correct and specific - which
      # is what made it survive review looking identical to its four good siblings. Scoped to
      # the guides the PR touches, same as the freshness gate above.
      - name: Guide SEO identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/check-guide-seo.mts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # /trust and /methodology tell readers the verdict chain is auditable end to end.
      # This is what keeps that sentence true: it reproduces each anchor's root from the
      # corpus at its own corpus_commit, re-folds the hash chain, and checks every .ots
      # proof stamps the chain_root it claims. Before this gate the claim rested on our
      # say-so, because the canonicalization lived only in a private repo.
      #
      # --self-test first, because a verifier that cannot fail is worse than none: it
      # pins the exact serialization, so a refactor cannot silently change every digest
      # and orphan the proofs already timestamped on Bitcoin.
      #
      # --last 3 --fetch, not the full ledger: checkout is depth-1 (this repo's history
      # is 1.2GB) so historical corpora are absent, and each one is a 25MB blob. A
      # blobless depth-1 fetch of one commit costs ~1s, so three is ~8s and catches the
      # regression that matters - the newest anchors no longer reproducing. Run the whole
      # ledger locally with `python3 scripts/verify_anchors.py` on a full clone.
      - name: Verify verdict anchors
        run: |
          python3 scripts/verify_anchors.py --self-test
          python3 scripts/verify_anchors.py --last 3 --fetch

  # WCAG AA text-contrast audit over the real rendered pages. Separate job (needs a browser +
  # a running server) so a contrast regression can no longer ship unnoticed - scripts/check-contrast.mjs
  # was previously manual-only. A 404 (data-backed page without its runtime env) is skipped; a
  # 5xx/timeout or any real violation fails the run.
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fail-fast: don't burn the browser download + full build if lint/typecheck/tests already broke.
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Build
        # NEXT_PUBLIC_* flags are inlined at build time; without them the data-backed pages
        # (/ledger, /drift-report, /dashboard) render notFound() and the audit skips them - the
        # pages with the most colored verdict chips. Enable them so they are actually audited;
        # they degrade to a 200 empty state without Redis (no secrets needed to render).
        run: npm run build
        env:
          NEXT_PUBLIC_DRIFT_LEDGER: '1'
          NEXT_PUBLIC_DRIFT_REPORT: '1'

      - name: Start server + WCAG AA contrast audit
        run: |
          npx next start -p 3000 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          node scripts/check-contrast.mjs http://localhost:3000
