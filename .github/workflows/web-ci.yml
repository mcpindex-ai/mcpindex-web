name: mcpindex-web CI

# Lint + typecheck + unit tests for the web app (repo root). Vercel runs `next build`
# on deploy but never the test suite, so without this a regression in lib/ledger,
# lib/driftStats, lib/driftQuery, lib/badge, etc. would ship unnoticed. ubuntu-only
# (macOS runners bill 10x) and scoped to web-app paths so a mcp-server-mcpindex-only
# change does not trigger it (that package has its own workflow).

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'test/**'
      - 'components/**'
      - 'scripts/**'
      - 'package.json'
      # data/** is here because `verify` is a REQUIRED check on main. A path filter that
      # skips it does not report "skipped" to branch protection - it reports nothing, so the
      # PR is permanently unmergeable. The source-liveness publisher opens a PR touching only
      # data/source-liveness.json, so every one of those was undismissable and the published
      # census silently sat a week stale. Data-only PRs are cheap to verify and this keeps
      # them mergeable without an admin bypass. (The 2-hourly verdict sync pushes straight to
      # main and never opens a PR, so it is unaffected by a pull_request filter.)
      - 'data/**'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'test/**'
      - 'components/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  # WCAG AA text-contrast audit over the real rendered pages. Separate job (needs a browser +
  # a running server) so a contrast regression can no longer ship unnoticed - scripts/check-contrast.mjs
  # was previously manual-only. A 404 (data-backed page without its runtime env) is skipped; a
  # 5xx/timeout or any real violation fails the run.
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fail-fast: don't burn the browser download + full build if lint/typecheck/tests already broke.
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Build
        # NEXT_PUBLIC_* flags are inlined at build time; without them the data-backed pages
        # (/ledger, /drift-report, /dashboard) render notFound() and the audit skips them - the
        # pages with the most colored verdict chips. Enable them so they are actually audited;
        # they degrade to a 200 empty state without Redis (no secrets needed to render).
        run: npm run build
        env:
          NEXT_PUBLIC_DRIFT_LEDGER: '1'
          NEXT_PUBLIC_DRIFT_REPORT: '1'

      - name: Start server + WCAG AA contrast audit
        run: |
          npx next start -p 3000 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          node scripts/check-contrast.mjs http://localhost:3000
