<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcpindex - 90-second demo</title>
    <meta
      name="description"
      content="90-second mcpindex demo of the in-path trust gate for MCP servers and agent tool calls. Embeddable promo video for talks, posts, and docs."
    />
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0b0d;
      }
      .wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #0a0b0d;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Poster goes through the image optimizer: 16 KiB WebP instead of a 236 KiB JPEG.
           This surface loads inside OTHER people's pages, so the weight is theirs to pay.
           Static HTML cannot call optimizedPosterSrc(), so the URL is hardcoded - and
           lib/posters.test.ts re-derives it from the real API and fails if the two drift. -->
      <video
        controls
        playsinline
        preload="metadata"
        poster="/_next/image?url=%2Fpromo%2Fposter.jpg&amp;w=1080&amp;q=75"
      >
        <source src="/promo/mcpindex-promo.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </body>
</html>
